
name: Build, Push, and Deploy Netflix Clone

on:
  push:
    branches:
      - release
      - master

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/netflix-clone:latest
            ${{ env.DOCKERHUB_USERNAME }}/netflix-clone:${{ github.sha }}

      - name: Copy Manifests
        run: |
          mkdir -p manifests
          cp k8-manifest/*.yaml manifests/

      - name: Patch Deployment Image
        run: |
          sed -i "s|image: .*|image: ${DOCKERHUB_USERNAME}/netflix-clone:${GITHUB_SHA}|" manifests/deployment.yaml
          echo "Updated image to ${DOCKERHUB_USERNAME}/netflix-clone:${GITHUB_SHA}"

      - name: Select Namespace
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "master" ]]; then
            NAMESPACE="prod"
          elif [[ "$BRANCH" == "release" ]]; then
            NAMESPACE="dev"
          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi

          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          echo "Using namespace: $NAMESPACE"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Context
        run: |
          az aks get-credentials \
            --resource-group demo-rg \
            --name MyAKSCluster \
            --overwrite-existing

      - name: Ensure Namespace Exists
        run: |
          kubectl get namespace "$NAMESPACE" || \
          kubectl create namespace "$NAMESPACE"

      - name: Deploy to AKS
        run: |
          DEPLOYMENT_NAME="netflix-clone-deployment"

          echo "Applying manifests to namespace: $NAMESPACE"

          kubectl apply -f manifests/deployment.yaml -n "$NAMESPACE"
          kubectl apply -f manifests/service.yaml -n "$NAMESPACE"

          echo "Waiting for rollout..."

          kubectl rollout status deployment/"$DEPLOYMENT_NAME" \
            -n "$NAMESPACE" \
            --timeout=120s

      - name: Get Service Info
        run: |
          kubectl get svc -n "$NAMESPACE"
