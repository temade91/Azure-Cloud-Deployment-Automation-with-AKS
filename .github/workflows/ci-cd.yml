name: Build, Push, and Deploy Netflix Clone

on:
  push:
    branches:
      - release
      - master

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Load DockerHub username
      - name: Load DockerHub username
        run: echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV

      # 3️⃣ Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Build + Push image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/netflix-clone:latest
            ${{ env.DOCKERHUB_USERNAME }}/netflix-clone:${{ github.sha }}

      # 6️⃣ Copy manifests
      - name: Copy Manifests
        run: |
          mkdir -p manifests
          cp -r k8-manifest/*.yaml manifests/

      # 7️⃣ Patch image
      - name: Patch Deployment Image
        run: |
          sed -i "s|image: .*|image: ${{ env.DOCKERHUB_USERNAME }}/netflix-clone:${{ github.sha }}|" manifests/deployment.yaml
          echo "Updated image to ${{ env.DOCKERHUB_USERNAME }}/netflix-clone:${{ github.sha }}"

      # 8️⃣ Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 9️⃣ AKS context
      - name: Get AKS Context
        run: |
          az aks get-credentials \
            --resource-group demo-rg \
            --name MyAKSCluster \
            --overwrite-existing

            - name: Select Namespace
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "master" ]]; then
            NAMESPACE="prod"
          elif [[ "$BRANCH" == "release" ]]; then
            NAMESPACE="dev"
          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi

          echo "namespace=$NAMESPACE" >> "$GITHUB_ENV"
          echo "Using namespace: $NAMESPACE"
      # 1️⃣1️⃣ Ensure namespace exists
      - name: Ensure Namespace Exists
        run: |
          kubectl get namespace ${{ env.namespace }} || \
          kubectl create namespace ${{ env.namespace }}

      # 1️⃣2️⃣ Deploy to AKS
      - name: Deploy to AKS
        run: |
          DEPLOYMENT_NAME="netflix-clone-deployment"

          echo "Applying manifests to namespace: ${{ env.namespace }}"

          if [ -f manifests/deployment.yaml ]; then
            kubectl apply -f manifests/deployment.yaml -n ${{ env.namespace }}
          fi

          if [ -f manifests/service.yaml ]; then
            kubectl apply -f manifests/service.yaml -n ${{ env.namespace }}
          fi

          echo "Waiting for rollout..."
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n ${{ env.namespace }} --timeout=120s

      # 1️⃣3️⃣ Show Service
      - name: Get Service Info
        run: |
          kubectl get svc -n ${{ env.namespace }}
